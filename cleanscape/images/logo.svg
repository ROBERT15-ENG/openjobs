<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 280" role="img" aria-labelledby="logo-title">
  <title id="logo-title">Cleanscape Solutions</title>
  <defs>
    <filter id="text-shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.5" flood-color="#b8c8c6" flood-opacity="0.55"/>
    </filter>
  </defs>

  <!-- Sparkles -->
  <g fill="#4cd964">
    <path d="M158 18 L160 26 L168 28 L160 30 L158 38 L156 30 L148 28 L156 26 Z"/>
    <path d="M182 32 L183 36 L187 37 L183 38 L182 42 L181 38 L177 37 L181 36 Z"/>
    <path d="M134 36 L135 40 L139 41 L135 42 L134 46 L133 42 L129 41 L133 40 Z"/>
  </g>

  <!-- Bucket -->
  <path fill="#0d5c5c" d="M118 88 C118 78 198 78 198 88 L202 148 C202 158 114 158 114 148 Z"/>
  <path fill="#0a4a4a" d="M114 148 C114 154 202 154 202 148 L198 88 C198 92 118 92 118 88 Z" opacity="0.25"/>

  <!-- Cloth on bucket -->
  <path fill="#3cb878" d="M188 92 C196 90 204 96 206 104 C208 112 200 118 192 116 L188 92 Z"/>

  <!-- Mop handle -->
  <rect x="156" y="34" width="6" height="118" rx="3" fill="#0d5c5c" transform="rotate(-8 159 93)"/>

  <!-- Mop head -->
  <ellipse cx="148" cy="152" rx="22" ry="10" fill="#0d5c5c" transform="rotate(-12 148 152)"/>
  <g fill="#148585" transform="rotate(-12 148 152)">
    <rect x="136" y="158" width="3" height="14" rx="1.5"/>
    <rect x="142" y="160" width="3" height="16" rx="1.5"/>
    <rect x="148" y="161" width="3" height="17" rx="1.5"/>
    <rect x="154" y="160" width="3" height="16" rx="1.5"/>
    <rect x="160" y="158" width="3" height="14" rx="1.5"/>
  </g>

  <!-- Wordmark -->
  <text x="160" y="198" text-anchor="middle" font-family="'DM Sans', Arial, sans-serif" font-size="34" font-weight="700" fill="#0d5c5c" filter="url(#text-shadow)">Cleanscape</text>
  <text x="160" y="232" text-anchor="middle" font-family="'DM Sans', Arial, sans-serif" font-size="34" font-weight="700" fill="#4cd964" filter="url(#text-shadow)">Solutions</text>
  <text x="160" y="258" text-anchor="middle" font-family="'DM Sans', Arial, sans-serif" font-size="13" font-weight="300" fill="#0d5c5c" letter-spacing="0.04em">Cleanliness, Simplified</text>
</svg>
