<style>
  :root {
    color-scheme: light dark;
    --bg: #0d1117;
    --fg: #e6edf3;
    --muted: #7d8590;
    --line: #30363d;
    --neutral: #161b22;
    --input: #1f3a5f;
    --process: #2d1b4e;
    --storage: #14332a;
    --external: #3d2a00;
    --risk: #3d1515;
    --accent: #58a6ff;
    --green: #3fb950;
    --purple: #bc8cff;
    --yellow: #d29922;
    --red: #f85149;
    --teal: #39d0c3;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f0f4f8;
      --fg: #1c2128;
      --muted: #57606a;
      --line: #d0d7de;
      --neutral: #ffffff;
      --input: #dbeafe;
      --process: #ede9fe;
      --storage: #d1fae5;
      --external: #fef3c7;
      --risk: #fee2e2;
      --accent: #1d4ed8;
      --green: #15803d;
      --purple: #7c3aed;
      --yellow: #92400e;
      --red: #dc2626;
      --teal: #0f766e;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font: 14px/1.4 ui-sans-serif, system-ui, -apple-system, sans-serif;
  }
  main { max-width: 1400px; margin: 0 auto; padding: 32px 24px; }
  h1 { font-size: 22px; font-weight: 700; margin: 0 0 6px; color: var(--fg); }
  .subtitle { font-size: 13px; color: var(--muted); margin: 0 0 32px; }
  .legend {
    display: flex; gap: 20px; flex-wrap: wrap;
    margin-bottom: 28px; font-size: 12px;
  }
  .legend-item { display: flex; align-items: center; gap: 6px; }
  .legend-dot { width: 10px; height: 10px; border-radius: 3px; }
  svg { width: 100%; height: auto; display: block; }
  .node-label { font-size: 12px; font-weight: 600; fill: var(--fg); }
  .node-sub { font-size: 10px; fill: var(--muted); }
  .node-icon { font-size: 11px; }
  .edge { stroke: var(--line); stroke-width: 1.5; fill: none; }
  .arrow { fill: var(--line); }
  .zone-label { font-size: 11px; font-weight: 700; fill: var(--muted); letter-spacing: 0.08em; text-transform: uppercase; }
  .step { font-size: 10px; fill: var(--muted); }
  .score-box { font-size: 10px; fill: var(--muted); }
</style>

<h1>OpenJobs — Code Architecture</h1>
<p class="subtitle">Full data flow: Resume Upload → AI Matching → For You Recommendations</p>

  <!-- semantic_matcher.py -->

  <text class="node-sub" x="750" y="182" text-anchor="middle" fill="var(--yellow)">borderline 1-3 keyword matches</text>
