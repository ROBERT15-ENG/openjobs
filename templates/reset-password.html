<!DOCTYPE html>
<html lang="en" data-ga-id="{{ ga_measurement_id }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Choose new password — {{ site_name }}</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/site-chrome.css">
  {% include 'includes/head_polish.html' %}
  <style>
    body { margin: 0; font-family: system-ui, sans-serif; background: #09090f; color: #ededf0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 1.5rem; }
    .card { max-width: 420px; width: 100%; background: #18181f; border: 1px solid #2a2a3e; border-radius: 14px; padding: 1.75rem; }
    h1 { font-size: 1.35rem; margin: 0 0 0.5rem; color: #00d4aa; }
    p { color: #6b6b80; font-size: 0.9rem; }
    label { display: block; font-size: 0.8rem; font-weight: 600; margin: 1rem 0 0.35rem; }
    .pass-wrap { position: relative; }
    input { width: 100%; padding: 0.65rem 0.85rem; border-radius: 10px; border: 1px solid #2a2a3e; background: #09090f; color: #ededf0; box-sizing: border-box; }
    .toggle { position: absolute; right: 0.5rem; top: 50%; transform: translateY(-50%); border: none; background: none; color: #6b6b80; cursor: pointer; font-size: 0.75rem; }
    .msg { margin-top: 1rem; padding: 0.65rem; border-radius: 8px; font-size: 0.85rem; display: none; }
    .msg.error { background: rgba(239,68,68,0.12); color: #fca5a5; }
    button { width: 100%; margin-top: 1.25rem; padding: 0.75rem; border: none; border-radius: 10px; background: #00d4aa; color: #000; font-weight: 700; cursor: pointer; }
    ul { font-size: 0.78rem; color: #6b6b80; margin: 0.5rem 0 0; padding-left: 1.1rem; }
  </style>
</head>
<body>
  <main class="card" id="main-content">
    <h1>New password</h1>
    <p id="tokenHint"></p>
    <form id="resetForm">
      <label for="password">Password</label>
      <div class="pass-wrap">
        <input type="password" id="password" required minlength="8" autocomplete="new-password">
        <button type="button" class="toggle" onclick="togglePass()">Show</button>
      </div>
      <ul>
        <li>At least 8 characters</li>
        <li>Uppercase, lowercase, and a number</li>
      </ul>
      <div class="msg error" id="err"></div>
      <button type="submit">Update password</button>
    </form>
  </main>
  {% include 'includes/site_polish.html' %}
  <script src="/static/site-polish.js"></script>
  <script>
    const token = new URLSearchParams(location.search).get('token') || '';
    const hint = document.getElementById('tokenHint');
    if (!token) {
      hint.textContent = 'Missing reset token. Request a new link from the forgot password page.';
      document.getElementById('resetForm').style.display = 'none';
    }
    function togglePass() {
      const inp = document.getElementById('password');
      const btn = event.target;
      if (inp.type === 'password') { inp.type = 'text'; btn.textContent = 'Hide'; }
      else { inp.type = 'password'; btn.textContent = 'Show'; }
    }
    document.getElementById('resetForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const err = document.getElementById('err');
      err.style.display = 'none';
      const password = document.getElementById('password').value;
      const res = await fetch('/api/auth/reset-password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token, password }),
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) {
        err.textContent = data.error || 'Reset failed.';
        err.style.display = 'block';
        return;
      }
      window.location.href = '/thank-you?type=password-reset';
    });
  </script>
</body>
</html>
