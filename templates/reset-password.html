<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password — OpenJobs</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: Inter, sans-serif; background: #09090f; color: #ededf0; min-height: 100vh; display: flex; align-items: center; justify-content: center; margin: 0; }
    .card { background: #111119; border: 1px solid #1e1e2e; border-radius: 16px; padding: 2rem; width: 100%; max-width: 420px; }
    h1 { margin: 0 0 0.5rem; }
    p { color: #6b6b80; }
    input { width: 100%; padding: 0.8rem 1rem; margin: 0.75rem 0; background: #09090f; border: 1px solid #1e1e2e; border-radius: 10px; color: #ededf0; box-sizing: border-box; }
    button { width: 100%; padding: 0.8rem; border: none; border-radius: 10px; background: #00d4aa; color: #000; font-weight: 700; cursor: pointer; }
    .note { margin-top: 1rem; font-size: 0.85rem; color: #6b6b80; }
    a { color: #00d4aa; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Choose a new password</h1>
    <p>Password reset tokens are not wired yet. Use this page once reset flow is enabled.</p>
    <input type="password" id="password" placeholder="New password">
    <input type="password" id="confirm" placeholder="Confirm password">
    <button onclick="submitNew()">Update password</button>
    <p class="note"><a href="/login">← Back to sign in</a></p>
    <p class="note" id="msg"></p>
  </div>
  <script>
    function submitNew() {
      document.getElementById('msg').textContent = 'Password reset API is not enabled yet.';
    }
  </script>
</body>
</html>
