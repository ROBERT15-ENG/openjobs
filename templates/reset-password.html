<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password — OpenJobs</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: Inter, sans-serif; background: #09090f; color: #ededf0; min-height: 100vh; display: flex; align-items: center; justify-content: center; margin: 0; }
    .card { background: #111119; border: 1px solid #1e1e2e; border-radius: 16px; padding: 2rem; width: 100%; max-width: 420px; }
    h1 { margin: 0 0 0.5rem; }
    p { color: #6b6b80; }
    input { width: 100%; padding: 0.8rem 1rem; margin: 0.75rem 0; background: #09090f; border: 1px solid #1e1e2e; border-radius: 10px; color: #ededf0; box-sizing: border-box; }
    button { width: 100%; padding: 0.8rem; border: none; border-radius: 10px; background: #00d4aa; color: #000; font-weight: 700; cursor: pointer; margin-top: 0.5rem; }
    button:disabled { opacity: 0.5; }
    .note { margin-top: 1rem; font-size: 0.85rem; color: #6b6b80; }
    .msg { margin-top: 1rem; font-size: 0.9rem; }
    .msg.ok { color: #22c55e; }
    .msg.err { color: #ef4444; }
    a { color: #00d4aa; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Choose a new password</h1>
    <p id="tokenHint">Enter your new password below.</p>
    <input type="password" id="password" placeholder="New password (min 6 chars)">
    <input type="password" id="confirm" placeholder="Confirm password">
    <button id="submitBtn" onclick="submitNew()">Update password</button>
    <p class="note"><a href="/login">← Back to sign in</a></p>
    <p class="msg" id="msg"></p>
  </div>
  <script>
    const token = new URLSearchParams(window.location.search).get('token') || '';
    if (!token) {
      document.getElementById('tokenHint').textContent = 'Missing reset token. Request a new link from the forgot password page.';
      document.getElementById('submitBtn').disabled = true;
    }

    async function submitNew() {
      const password = document.getElementById('password').value;
      const confirm = document.getElementById('confirm').value;
      const msg = document.getElementById('msg');
      const btn = document.getElementById('submitBtn');
      msg.className = 'msg';
      if (password.length < 6) { msg.textContent = 'Password must be at least 6 characters.'; msg.classList.add('err'); return; }
      if (password !== confirm) { msg.textContent = 'Passwords do not match.'; msg.classList.add('err'); return; }
      btn.disabled = true;
      try {
        const res = await fetch('/api/auth/reset-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token, password })
        });
        const data = await res.json();
        if (res.ok && data.success) {
          msg.textContent = 'Password updated! Redirecting to sign in...';
          msg.classList.add('ok');
          setTimeout(() => { window.location.href = '/login'; }, 1500);
        } else {
          msg.textContent = data.error || 'Could not reset password.';
          msg.classList.add('err');
          btn.disabled = false;
        }
      } catch {
        msg.textContent = 'Network error. Try again.';
        msg.classList.add('err');
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
