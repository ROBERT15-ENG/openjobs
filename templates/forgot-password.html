<!DOCTYPE html>
<html lang="en" data-ga-id="{{ ga_measurement_id }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Forgot password — {{ site_name }}</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/site-chrome.css">
  {% include 'includes/head_polish.html' %}
  <style>
    body { margin: 0; font-family: system-ui, sans-serif; background: #09090f; color: #ededf0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 1.5rem; }
    .card { max-width: 420px; width: 100%; background: #18181f; border: 1px solid #2a2a3e; border-radius: 14px; padding: 1.75rem; }
    h1 { font-size: 1.35rem; margin: 0 0 0.5rem; color: #00d4aa; }
    p { color: #6b6b80; font-size: 0.9rem; line-height: 1.5; }
    label { display: block; font-size: 0.8rem; font-weight: 600; margin: 1rem 0 0.35rem; }
    input { width: 100%; padding: 0.65rem 0.85rem; border-radius: 10px; border: 1px solid #2a2a3e; background: #09090f; color: #ededf0; }
    input.form-field-error { border-color: #ef4444; }
    .msg { margin-top: 1rem; padding: 0.65rem; border-radius: 8px; font-size: 0.85rem; display: none; }
    .msg.error { background: rgba(239,68,68,0.12); color: #fca5a5; }
    .msg.ok { background: rgba(34,197,94,0.12); color: #86efac; }
    button { width: 100%; margin-top: 1.25rem; padding: 0.75rem; border: none; border-radius: 10px; background: #00d4aa; color: #000; font-weight: 700; cursor: pointer; }
    a { color: #00d4aa; text-decoration: none; font-size: 0.85rem; }
  </style>
</head>
<body>
  <main class="card" id="main-content">
    <p><a href="/login">← Back to sign in</a></p>
    <h1>Reset your password</h1>
    <p>Enter your email and we&apos;ll send a reset link (valid 1 hour).</p>
    <form id="forgotForm">
      <label for="email">Email</label>
      <input type="email" id="email" required autocomplete="email" placeholder="you@example.com">
      <div class="msg error" id="err"></div>
      <div class="msg ok" id="ok"></div>
      <button type="submit">Send reset link</button>
    </form>
  </main>
  {% include 'includes/site_polish.html' %}
  <script src="/static/site.js"></script>
  <script src="/static/site-polish.js"></script>
  <script>
    document.getElementById('forgotForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const err = document.getElementById('err');
      const ok = document.getElementById('ok');
      err.style.display = ok.style.display = 'none';
      if (!email.includes('@')) {
        err.textContent = 'Enter a valid email address.';
        err.style.display = 'block';
        return;
      }
      const res = await fetch('/api/auth/forgot-password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email }),
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) {
        err.textContent = data.error || 'Could not send email. Try again later.';
        err.style.display = 'block';
        return;
      }
      ok.textContent = data.message || 'If that email exists, a reset link has been sent.';
      ok.style.display = 'block';
    });
  </script>
</body>
</html>
