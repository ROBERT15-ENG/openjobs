<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password — OpenJobs</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: Inter, sans-serif; background: #09090f; color: #ededf0; min-height: 100vh; display: flex; align-items: center; justify-content: center; margin: 0; }
    .card { background: #111119; border: 1px solid #1e1e2e; border-radius: 16px; padding: 2rem; width: 100%; max-width: 420px; }
    h1 { margin: 0 0 0.5rem; }
    p { color: #6b6b80; }
    input { width: 100%; padding: 0.8rem 1rem; margin: 1rem 0; background: #09090f; border: 1px solid #1e1e2e; border-radius: 10px; color: #ededf0; box-sizing: border-box; }
    button { width: 100%; padding: 0.8rem; border: none; border-radius: 10px; background: #00d4aa; color: #000; font-weight: 700; cursor: pointer; }
    button:disabled { opacity: 0.5; }
    .note { margin-top: 1rem; font-size: 0.85rem; color: #6b6b80; }
    .msg { margin-top: 1rem; font-size: 0.9rem; }
    .msg.ok { color: #22c55e; }
    .msg.err { color: #ef4444; }
    a { color: #00d4aa; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Reset password</h1>
    <p>Enter the email you signed up with and we'll send you a link to choose a new password.</p>
    <input type="email" id="email" placeholder="you@example.com">
    <button id="submitBtn" onclick="submitReset()">Send reset link</button>
    <p class="note"><a href="/login">← Back to sign in</a></p>
    <p class="msg" id="msg"></p>
  </div>
  <script>
    async function submitReset() {
      const email = document.getElementById('email').value.trim();
      const msg = document.getElementById('msg');
      const btn = document.getElementById('submitBtn');
      msg.className = 'msg';
      if (!email) { msg.textContent = 'Please enter your email.'; msg.classList.add('err'); return; }
      btn.disabled = true;
      try {
        const res = await fetch('/api/auth/forgot-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email })
        });
        const data = await res.json();
        if (res.ok && data.email_delivery === false) {
          msg.textContent = data.message;
          msg.classList.add('err');
        } else if (res.ok) {
          msg.textContent = data.message || 'If that email exists, a reset link has been sent.';
          msg.classList.add('ok');
        } else {
          msg.textContent = data.error || 'Could not send reset email.';
          msg.classList.add('err');
        }
      } catch {
        msg.textContent = 'Network error. Try again.';
        msg.classList.add('err');
      }
      btn.disabled = false;
    }
  </script>
</body>
</html>
