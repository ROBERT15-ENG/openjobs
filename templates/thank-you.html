<!DOCTYPE html>
<html lang="en" data-ga-id="{{ ga_measurement_id }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Thank you — {{ site_name }}</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <style>
    body { margin: 0; font-family: system-ui, sans-serif; background: #09090f; color: #ededf0; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 2rem; }
    .ok { font-size: 3rem; }
    h1 { font-size: 1.75rem; }
    p { color: #6b6b80; max-width: 440px; line-height: 1.6; }
    a { color: #00d4aa; font-weight: 600; text-decoration: none; }
    a.btn { display: inline-block; margin: 0.5rem; background: #00d4aa; color: #000; padding: 0.75rem 1.5rem; border-radius: 10px; }
  </style>
  <link rel="stylesheet" href="/static/site-chrome.css">
  {% include 'includes/head_polish.html' %}
</head>
<body>
  <main id="main-content">
  <div class="ok">✓</div>
  <h1>{{ headline }}</h1>
  <p>{{ message }}</p>
  <p><a class="btn" href="/user">View dashboard</a> <a href="/">Browse more jobs</a></p>
  </main>
  {% include 'includes/cookie_banner.html' %}
  {% include 'includes/site_polish.html' %}
  <script src="/static/site.js"></script>
  <script src="/static/site-polish.js"></script>
</body>
</html>
