[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"api/app_factory.py" = ["E402"]
"tests/test_matcher.py" = ["E402"]
"api/semantic_matcher.py" = ["F841", "I001"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["api"]
